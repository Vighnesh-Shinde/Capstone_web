<section class="diagrams">
<h2 id="diagrams">A. ARCHITECTURE AND IMPLEMENTATION DIAGRAMS</h2>
<p class="lead">Five diagrams of the system as it actually runs today: the services, one
session end to end, the inside of the shipped model, how a prediction is explained, and
how a model reaches production.</p>

<figure class="page-break">

  <rect class="bx step" x="250" y="30" width="180" height="66" rx="9"/>
  <text class="t" x="264" y="54">2 · AUDIO</text>
  <text class="s" x="264" y="74">ffmpeg → 16 kHz mono WAV</text>
  <text class="s" x="264" y="90">video → 30 fps for OpenFace</text>

  <rect class="bx step" x="470" y="30" width="180" height="66" rx="9"/>
  <text class="t" x="484" y="54">3 · TRANSCRIBE</text>
  <text class="s" x="484" y="74">faster-whisper (small, int8)</text>

  <text class="s" x="264" y="194">counsellor + companions enrolled earlier → 256-d embeddings</text>
  <text class="s" x="264" y="212">cosine match ≥ 0.55 and ≥ 0.06 clear of the runner-up; whoever is</text>

  <text class="t" x="264" y="294">6 · ADEQUACY GUARD</text>

  <text class="t" x="134" y="400">7 · FEATURES (participant only)</text>

  <text class="t" x="554" y="400">8 · SCORE (early fusion v2)</text>
  <text class="s" x="554" y="420">one model, 3,384 inputs by NAME</text>
  <text class="s" x="554" y="438">score vs cut-off 0.4412</text>
  <text class="s" x="554" y="456">SHAP + sentence + face attribution</text>

  <rect class="bx step" x="250" y="510" width="400" height="80" rx="9"/>
  <text class="t" x="264" y="534">9 · STORE AND REPORT</text>
  <text class="s" x="264" y="554">prediction, shares, explanation factors, scoring details,</text>

  <line class="ln" x1="380" y1="336" x2="260" y2="372" marker-end="url(#ar2)"/>

  <text class="lb" x="140" y="500">OpenFace runs in parallel with steps 3–4</text>
</svg>

<!-- ============================ A3 MODEL INTERNALS ============================ -->
<figure class="page-break">
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Inside the shipped early-fusion model">
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b21b6"/>
    </marker>
  </defs>

  <text class="t big" x="30" y="34">EARLY FUSION v2 — one model on all 3,384 measurements</text>

  <!-- blocks -->
  <rect class="bx blk" x="30" y="60" width="210" height="70" rx="9"/>
  <text class="t" x="44" y="84">TEXT — 3,096</text>
  <text class="s" x="44" y="104">24 word habits</text>
  <text class="s" x="44" y="120">3,072 sentence meaning</text>

  <rect class="bx blk" x="30" y="210" width="210" height="70" rx="9"/>
  <text class="t" x="44" y="234">AUDIO — 64</text>
  <text class="s" x="44" y="254">pitch, loudness, jitter,</text>
  <text class="s" x="44" y="270">shimmer, timing (participant only)</text>

  <rect class="bx blk" x="30" y="360" width="210" height="70" rx="9"/>
  <text class="t" x="44" y="384">VIDEO — 224</text>
  <text class="s" x="44" y="404">14 action units + 6 presence</text>
  <text class="s" x="44" y="420">rates + 12 gaze directions</text>

  <!-- per block processing -->
  <rect class="bx" x="290" y="60" width="250" height="70" rx="9"/>
  <text class="s" x="304" y="84">median impute → standardise</text>
  <text class="s" x="304" y="104">→ PCA 20 components</text>
  <text class="s" x="304" y="122">→ × 0.2236 (block weight)</text>

  <rect class="bx" x="290" y="210" width="250" height="70" rx="9"/>
  <text class="s" x="304" y="234">median impute → standardise</text>
  <text class="s" x="304" y="254">→ PCA 10 components</text>
  <text class="s" x="304" y="272">→ × 0.6325 (block weight)</text>

  <rect class="bx" x="290" y="360" width="250" height="70" rx="9"/>
  <text class="s" x="304" y="384">median impute → standardise</text>
  <text class="s" x="304" y="404">→ PCA 10 components</text>
  <text class="s" x="304" y="422">→ × 0.3162 (block weight)</text>

  <!-- concat -->
  <rect class="bx" x="590" y="200" width="150" height="90" rx="9"/>
  <text class="t" x="604" y="226">CONCATENATE</text>
  <text class="s" x="604" y="248">40 components</text>
  <text class="s" x="604" y="266">20 + 10 + 10</text>
  <text class="s" x="604" y="284">one vector</text>

  <!-- classifier -->
  <rect class="bx ml" x="790" y="180" width="180" height="130" rx="9"/>
  <text class="t" x="804" y="206">LOGISTIC REGRESSION</text>
  <text class="s" x="804" y="228">penalty L2, C = 0.1</text>
  <text class="s" x="804" y="248">z = intercept + Σ coef·comp</text>
  <text class="s" x="804" y="268">p = 1 / (1 + e^−z)</text>
  <text class="s" x="804" y="290">p ≥ 0.4412 → Depressed</text>

  <!-- back-mapping -->
  <rect class="note" x="290" y="460" width="680" height="80" rx="9"/>
  <text class="t" x="308" y="484">WHY EXPLANATION IS EXACT</text>
  <text class="s" x="308" y="506">PCA and logistic regression are both linear, so the chain collapses to one weight per original column:</text>
  <text class="s mono" x="308" y="528">w_original = (coef[block] × block weight) @ pca.components_ , then shap_i = w_original_i × (x_i − mean_i) / std_i</text>

  <line class="ln" x1="240" y1="95" x2="285" y2="95" marker-end="url(#ar3)"/>
  <line class="ln" x1="240" y1="245" x2="285" y2="245" marker-end="url(#ar3)"/>
  <line class="ln" x1="240" y1="395" x2="285" y2="395" marker-end="url(#ar3)"/>
  <line class="ln" x1="540" y1="95" x2="588" y2="215" marker-end="url(#ar3)"/>
  <line class="ln" x1="540" y1="245" x2="585" y2="245" marker-end="url(#ar3)"/>
  <line class="ln" x1="540" y1="395" x2="588" y2="278" marker-end="url(#ar3)"/>
  <line class="ln" x1="740" y1="245" x2="785" y2="245" marker-end="url(#ar3)"/>
  <line class="ln dash" x1="880" y1="310" x2="880" y2="455" marker-end="url(#ar3)"/>

  <text class="lb" x="590" y="330">measured share of the decision:</text>
  <text class="lb" x="590" y="348">text 77.1% · audio 12.8% · video 10.2%</text>
</svg>
<figcaption>A3 — Inside the shipped model. Per-block PCA plus block weights are what stop
the 3,096 text columns from swamping 64 audio and 224 video columns.</figcaption>
</figure>

<!-- ============================ A4 EXPLAINABILITY ============================ -->
<figure class="page-break">
<svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="How one prediction becomes four kinds of explanation">
  <defs>
    <marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b21b6"/>
    </marker>
  </defs>

  <rect class="bx ml" x="30" y="150" width="220" height="120" rx="9"/>
  <text class="t" x="44" y="176">PREDICTION</text>
  <text class="s" x="44" y="198">log-odds z, probability p</text>
  <text class="s" x="44" y="218">SHAP per feature (exact)</text>
  <text class="s" x="44" y="238">Σ shap + intercept = z</text>
  <text class="s" x="44" y="258">verified to 3.55e−15</text>

  <rect class="bx" x="330" y="30" width="290" height="86" rx="9"/>
  <text class="t" x="344" y="54">1 · FEATURE BREAKDOWN</text>
  <text class="s" x="344" y="74">strongest features, each with what was</text>
  <text class="s" x="344" y="92">observed and which way it pushed</text>
  <text class="s" x="344" y="108">glossary turns names into plain English</text>

  <rect class="bx" x="330" y="140" width="290" height="86" rx="9"/>
  <text class="t" x="344" y="164">2 · SENTENCE ATTRIBUTION</text>
  <text class="s" x="344" y="184">text score split across the participant's</text>
  <text class="s" x="344" y="202">own answers — exact for 3 of 4 poolings,</text>
  <text class="s" x="344" y="218">the 4th shown as unattributed remainder</text>

  <rect class="bx" x="330" y="250" width="290" height="86" rx="9"/>
  <text class="t" x="344" y="274">3 · FACE REGIONS</text>
  <text class="s" x="344" y="294">224 video features mapped to brows, eyes,</text>
  <text class="s" x="344" y="312">cheeks, mouth, chin, gaze — shaded by</text>
  <text class="s" x="344" y="328">their real contribution. NOT Grad-CAM.</text>

  <rect class="bx" x="330" y="360" width="290" height="86" rx="9"/>
  <text class="t" x="344" y="384">4 · MODALITY SHARES</text>
  <text class="s" x="344" y="404">share_m = Σ|shap in m| / Σ|shap|</text>
  <text class="s" x="344" y="422">how much of the reasoning rested on each</text>
  <text class="s" x="344" y="438">— not a separate verdict per modality</text>

  <rect class="bx db" x="690" y="140" width="280" height="196" rx="9"/>
  <text class="t" x="704" y="166">THE COUNSELLOR'S REPORT</text>
  <text class="s" x="704" y="188">depression score with cut-off marked</text>
  <text class="s" x="704" y="208">caution box when input is out of range</text>
  <text class="s" x="704" y="228">modality shares</text>
  <text class="s" x="704" y="248">feature breakdown</text>
  <text class="s" x="704" y="268">"which answers moved the result"</text>
  <text class="s" x="704" y="288">"what the face contributed"</text>
  <text class="s" x="704" y="308">"in plain words" — for the participant</text>
  <text class="s" x="704" y="328">counsellor's own judgement, stored apart</text>

  <line class="ln" x1="250" y1="190" x2="325" y2="80" marker-end="url(#ar4)"/>
  <line class="ln" x1="250" y1="205" x2="325" y2="185" marker-end="url(#ar4)"/>
  <line class="ln" x1="250" y1="225" x2="325" y2="290" marker-end="url(#ar4)"/>
  <line class="ln" x1="250" y1="240" x2="325" y2="398" marker-end="url(#ar4)"/>
  <line class="ln" x1="620" y1="75" x2="686" y2="175" marker-end="url(#ar4)"/>
  <line class="ln" x1="620" y1="183" x2="686" y2="210" marker-end="url(#ar4)"/>
  <line class="ln" x1="620" y1="293" x2="686" y2="265" marker-end="url(#ar4)"/>
  <line class="ln" x1="620" y1="403" x2="686" y2="300" marker-end="url(#ar4)"/>
</svg>
<figcaption>A4 — One prediction, four kinds of explanation. Everything shown on a report is
derived from the same exact SHAP decomposition, never from a separate explainer model.</figcaption>
</figure>

<!-- ============================ A5 MODEL LIFECYCLE ============================ -->
<figure class="page-break">
<svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Model lifecycle from upload to serving">
  <defs>
    <marker id="ar5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b21b6"/>
    </marker>
  </defs>

  <rect class="bx" x="20" y="60" width="170" height="90" rx="9"/>
  <text class="t" x="34" y="84">1 · UPLOAD</text>
  <text class="s" x="34" y="104">admin uploads .joblib</text>
  <text class="s" x="34" y="122">stored, SHA-256 hashed,</text>
  <text class="s" x="34" y="140">size-capped, audit-logged</text>

  <rect class="bx ml" x="220" y="60" width="200" height="90" rx="9"/>
  <text class="t" x="234" y="84">2 · VALIDATE</text>
  <text class="s" x="234" y="104">loadable? predict_proba?</text>
  <text class="s" x="234" y="122">threshold present?</text>
  <text class="s" x="234" y="140">every column NAME producible?</text>

  <rect class="bx" x="450" y="60" width="180" height="90" rx="9"/>
  <text class="t" x="464" y="84">3 · ACTIVATE</text>
  <text class="s" x="464" y="104">one active row per</text>
  <text class="s" x="464" y="122">(modality, language)</text>
  <text class="s" x="464" y="140">manifest rewritten</text>

  <rect class="bx ml" x="660" y="60" width="180" height="90" rx="9"/>
  <text class="t" x="674" y="84">4 · HOT RELOAD</text>
  <text class="s" x="674" y="104">models reloaded in place</text>
  <text class="s" x="674" y="122">cache swapped only if</text>
  <text class="s" x="674" y="140">every model loads</text>

  <rect class="bx db" x="870" y="60" width="110" height="90" rx="9"/>
  <text class="t" x="884" y="84">5 · SERVING</text>

  <rect class="bx stop" x="220" y="200" width="410" height="110" rx="9"/>

  <text class="s" x="234" y="246">rejected file is deleted and never recorded</text>
