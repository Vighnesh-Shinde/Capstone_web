server:
  port: 8080

spring:
  application:
    name: depression-detection-backend
  # Local secrets (admin credentials, JWT key, SMTP password) live in
  # backend/.env, which is gitignored. `optional:` means the app still starts
  # cleanly when the file is absent — a real deployment sets real env vars
  # instead, which take precedence over anything in this file.
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/depression_db
    username: depression_user
    password: depression_pass
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Headroom over app.uploads.video-max-bytes (300MB) and
      # app.models.max-bytes (500MB); those limits are enforced per-endpoint
      # with a useful error message, this is only the outer guard.
      max-file-size: 520MB
      max-request-size: 520MB
  # SMTP for password-reset emails. Leave MAIL_HOST unset and MailService logs
  # the reset link instead of sending it — nothing breaks before you configure
  # a provider. Supply your own credentials in backend/.env (gitignored).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-super-secret-key-for-depression-detection-platform-jwt-signing}
    expiration-ms: 43200000
  # Operator ADMIN account, seeded on first startup by AdminAccountSeeder.
  # There is no self-service admin signup by design.
  admin:
    username: ${ADMIN_USERNAME:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Administrator}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@depression-platform.local}
  password-reset:
    token-ttl-minutes: 30
  seed-demo-data: ${SEED_DEMO_DATA:true}
  demo-admin-password: ${DEMO_ADMIN_PASSWORD:Admin#2026Secure}
  demo-counselor-password: ${DEMO_COUNSELOR_PASSWORD:Counselor#2026Secure}
  rate-limit:
    login:
      max-attempts: 10
      window-minutes: 15
    application-submit:
      max-attempts: 5
      window-minutes: 15
    password-reset:
      max-attempts: 5
      window-minutes: 15
  uploads:
    # Relative to the backend process's working directory. The documented way to
    # run the backend is `cd backend && ./mvnw spring-boot:run`, so this resolves
    # to the top-level uploads/ directory shown in the repo layout, not backend/uploads.
    dir: ../uploads
    video-max-bytes: 314572800   # 300MB
    document-max-bytes: 10485760 # 10MB
  ml-service:
    base-url: ${ML_SERVICE_URL:http://localhost:8000}
    # Shared secret for the ML service's /internal/* operator endpoints.
    # Must match ML_ADMIN_TOKEN in ml-service/.env. If unset, the ML service
    # refuses those endpoints outright rather than allowing them unauthenticated.
    admin-token: ${ML_ADMIN_TOKEN:}
  models:
    # Where uploaded model weights are written. The ML service reads the same
    # directory, so in a containerised deployment this must be a shared volume.
    dir: ${MODELS_DIR:../ml-service/models}
    max-bytes: 524288000   # 500MB
  video-retention:
    # Raw recordings are deleted after this many days. Reports, transcripts and
    # feature vectors are kept, so retention costs neither the clinical record
    # nor the ability to retrain.
    enabled: ${VIDEO_RETENTION_ENABLED:true}
    days: ${VIDEO_RETENTION_DAYS:30}
    cron: ${VIDEO_RETENTION_CRON:0 15 3 * * *}
  cors:
    # Comma-separated. Overridable via CORS_ALLOWED_ORIGINS in backend/.env —
    # e.g. to add a LAN address so a phone or another laptop on the same
    # network can reach a locally-run frontend. Previously hardcoded with no
    # placeholder, so setting the env var (already documented in the README's
    # env var table) silently did nothing outside the `prod` profile.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.project.depression: INFO
